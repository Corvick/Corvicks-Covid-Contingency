<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>frame bench</title>
    <style>
      /*
        The game's own canvas CSS, copied from index.html rather than
        approximated. How the canvas is presented is the thing under test, so
        the stage has to letterbox exactly as the real one does.
      */
      html, body {
        margin: 0; height: 100%; background: #111; overflow: hidden;
        font-family: sans-serif;
      }
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      canvas { display: block; width: 100%; height: 100%; background: #222; }
      #out {
        position: absolute; top: 8px; left: 12px; margin: 0;
        color: #cfd6dd; font: 12px/1.4 ui-monospace, Consolas, monospace;
        text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage"><pre id="out">measuring…</pre></div>
    <script type="module" src="/src/framebench.ts"></script>
  </body>
</html>
