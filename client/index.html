<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zombie Simulator</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: sans-serif; }
      #stage { position: relative; width: 960px; margin: 40px auto; }
      canvas { display: block; background: #222; cursor: none; }

      #hud {
        position: absolute; top: 8px; left: 12px;
        color: #cbd5e1; font-size: 13px; letter-spacing: 0.02em;
        text-shadow: 0 1px 3px #000; pointer-events: none;
      }

      #perf {
        position: absolute; top: 8px; right: 12px;
        color: #94a3b8; font-size: 12px; text-align: right;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        text-shadow: 0 1px 3px #000; pointer-events: none; line-height: 1.5;
      }
      #perf .warn { color: #fbbf24; }
      #perf .bad { color: #f87171; }

      .overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6);
      }
      .overlay.hidden { display: none; }

      .panel {
        background: #1f2937; color: #fff;
        padding: 24px 32px; border-radius: 8px; text-align: center;
        min-width: 240px;
      }
      .panel h2 { margin: 0 0 4px; font-size: 20px; }
      .panel p { margin: 0 0 16px; color: #9ca3af; font-size: 13px; }
      .panel button {
        display: block; width: 100%; margin-top: 8px;
        padding: 9px 24px; font-size: 15px; cursor: pointer;
        border: none; border-radius: 4px; background: #ef4444; color: white;
      }
      .panel button.secondary { background: #374151; }
      .panel button:hover { filter: brightness(1.15); }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud"></div>
      <div id="perf"></div>

      <div id="menu" class="overlay hidden">
        <div class="panel">
          <h2>Paused</h2>
          <p>Esc to close</p>
          <button id="restart-btn">Restart</button>
          <button id="spectate-btn" class="secondary">Restart in spectator mode</button>
        </div>
      </div>

      <div id="game-over" class="overlay hidden">
        <div class="panel">
          <h2>Game Over</h2>
          <p>Every survivor has turned.</p>
          <button id="game-over-restart">Restart</button>
        </div>
      </div>

      <div id="victory" class="overlay hidden">
        <div class="panel">
          <h2>Outbreak Contained</h2>
          <p>Every zombie has been put down.</p>
          <button id="victory-restart">Play again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
